name: docs

on:
  push:
  workflow_dispatch:

# =========================================================================
# CONCURRENCY MANAGER (Cancels excessive outdated runs)
# =========================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  docs:
    runs-on: ubuntu-24.04
    container:
      image: tinytapeout/tt-support-tools:latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Inject Prefix Check & Build Docs
        run: |
          # 1. Back up your clean, custom info.yaml file layout config
          cp info.yaml info.yaml.bak
          
          # 2. Temporarily apply 'tt_um_' to fake out the internal validation scripts
          sed -i 's/top_module: "\([^"]*\)"/top_module: "tt_um_\1"/' info.yaml
          sed -i "s/top_module: \([^'\"].*\)/top_module: tt_um_\1/" info.yaml
          
          # 3. Generate your project documentation sheets with your custom module name
          python3 -m tt_support_tools.markdown_docs
          
          # 4. Instantly restore your original custom naming configuration layout
          mv info.yaml.bak info.yaml